name: Build & Deploy MuseRadio Web Installer

on:
  push:
    branches:
      - main
    paths:
      - 'Raspiaudio.yaml'
      - 'common/**'
      - 'stations/**'
      - 'images/**'
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Compiler le firmware ESPHome
        id: build
        uses: esphome/build-action@v7.1.0
        with:
          yaml-file: Raspiaudio.yaml
          complete-manifest: true

      - name: Sauvegarder les firmwares (.bin et .elf) en artefact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.name }}/*.bin
            ${{ steps.build.outputs.name }}/*.elf
            .esphome/build/**/.pioenvs/**/firmware.elf
          if-no-files-found: warn
          retention-days: 30

      - name: Préparer le site GitHub Pages
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          ls -la "${{ steps.build.outputs.name }}"
          MANIFEST_FILE=$(find "${{ steps.build.outputs.name }}" -name "*manifest.json" | head -n 1)
          if [ -z "$MANIFEST_FILE" ]; then
            echo "Erreur : aucun fichier manifest.json généré !"
            exit 1
          fi
          cp "$MANIFEST_FILE" _site/manifest.json
          cp "${{ steps.build.outputs.name }}"/*.factory.bin _site/
          cat _site/manifest.json

      - name: Uploader l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
