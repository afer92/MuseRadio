name: Build & Deploy MuseRadio Web Installer

on:
  push:
    branches:
      - main
    paths:
      - 'Raspiaudio.yaml'
      - 'common/**'
      - 'stations/**'
      - 'images/**'
      - 'docs/index.html'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Compiler le firmware ESPHome
        id: build
        uses: esphome/build-action@v7.1.0
        with:
          yaml-file: Raspiaudio.yaml
          complete-manifest: true

      - name: Sauvegarder les firmwares (.bin et .elf) en artefact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: |
            ${{ steps.build.outputs.name }}/*.bin
            ${{ steps.build.outputs.name }}/*.elf
            .esphome/build/**/.pioenvs/**/firmware.elf
          if-no-files-found: warn
          retention-days: 30

      - name: Copier manifest.json et .bin dans docs/ et pousser sur GitHub
        run: |
          MANIFEST_FILE=$(find "${{ steps.build.outputs.name }}" -name "*manifest.json" | head -n 1)
          if [ -z "$MANIFEST_FILE" ]; then
            echo "Erreur : aucun fichier manifest.json généré !"
            exit 1
          fi
          cp "$MANIFEST_FILE" docs/manifest.json
          cp "${{ steps.build.outputs.name }}"/*.bin docs/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -f docs/manifest.json docs/*.bin
          git commit -m "chore: update compiled firmware in docs/ [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Préparer le site GitHub Pages
        run: |
          mkdir -p _site
          cp -r docs/* _site/

      - name: Uploader l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
