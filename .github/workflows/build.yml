name: Build ESPHome Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ESPHome firmware
        id: build
        uses: esphome/build-action@v7.3.0
        with:
          yaml-file: Raspiaudio.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-radio-firmware
          path: .esphome/build/**/firmware*.bin

      - name: Attach binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: .esphome/build/**/firmware*.bin

      - name: Update GitHub Pages factory binary
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        run: |
          FACTORY_BIN=$(find .esphome/build -name "firmware.factory.bin" | head -n 1)
          echo "Found factory binary at: $FACTORY_BIN"
          cp "$FACTORY_BIN" docs/firmware.factory.bin
          VERSION="${GITHUB_REF_NAME:-latest}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" docs/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/firmware.factory.bin docs/manifest.json
          git commit -m "chore: update web installer binary for ${VERSION}" || exit 0
          git push origin HEAD:main
