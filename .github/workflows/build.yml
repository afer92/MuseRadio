name: Build ESPHome Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ESPHome firmware
        id: build
        uses: esphome/build-action@v7.3.0
        with:
          yaml-file: Raspiaudio.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-radio-firmware
          path: ${{ steps.build.outputs.firmware-path }}/*.bin

      - name: Attach binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.firmware-path }}/*.bin

      - name: Update GitHub Pages factory binary on Release
        if: github.event_name == 'release'
        run: |
          FACTORY_BIN=$(find "${{ steps.build.outputs.firmware-path }}" -name "*factory.bin" | head -n 1)
          cp "$FACTORY_BIN" docs/firmware.factory.bin
          sed -i "s/\"version\": \".*\"/\"version\": \"${GITHUB_REF_NAME}\"/" docs/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add docs/firmware.factory.bin docs/manifest.json
          git commit -m "chore: update web installer binary for ${GITHUB_REF_NAME}" || exit 0
          git push origin HEAD:main
