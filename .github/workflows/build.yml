name: Build ESPHome Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile ESPHome firmware
        id: build
        uses: esphome/build-action@v7.3.0
        with:
          yaml-file: Raspiaudio.yaml

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: muse-radio-firmware
          path: ${{ steps.build.outputs.firmware-path }}/*.bin

      - name: Attach binary to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.firmware-path }}/*.bin
