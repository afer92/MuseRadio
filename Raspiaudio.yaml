display:
  - id: myDisplay
    platform: mipi_spi
    spi_id: spi_bus0
    model: ST7789V
    cs_pin: GPIO40
    dc_pin: GPIO39
    reset_pin: GPIO9
    invert_colors: true
    color_depth: 16
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    update_interval: never
    auto_clear_enabled: false
    pages:
      - id: presetP
        lambda: |-
          const int w = it.get_width();
          const int h = it.get_height();
          it.filled_rectangle(0, 0, w, h, id(ma_bg));
          it.filled_rectangle(12, h / 2 - 42, w - 24, 84, id(ma_panel));
          it.rectangle(12, h / 2 - 42, w - 24, 84, id(ma_accent));
          it.printf(w / 2, h / 2, id(ma_font_heading), id(ma_text),
                    TextAlign::CENTER, "%s", id(preset_message).c_str());

      - id: musicP
        lambda: |-
          const int w = it.get_width();
          const int h = it.get_height();
          auto valid = [](const std::string &s) -> bool {
            return !s.empty() && s != "unknown" && s != "unavailable" && s != "None";
          };
          auto text_width = [&](display::BaseFont *font, const std::string &text) -> int {
            int x1, y1, width, height;
            it.get_text_bounds(0, 0, text.c_str(), font, TextAlign::TOP_LEFT,
                               &x1, &y1, &width, &height);
            return width;
          };
          auto fit_text = [&](display::BaseFont *font, std::string text, int width) -> std::string {
            if (text_width(font, text) <= width) return text;
            while (!text.empty()) {
              size_t end = text.size() - 1;
              while (end > 0 && (static_cast<unsigned char>(text[end]) & 0xC0) == 0x80) --end;
              text.resize(end);
              if (text_width(font, text + "...") <= width) return text + "...";
            }
            return "";
          };

          const bool is_local_web_radio =
              id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
              id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;

          char temp_str[16];
          if (std::isnan(id(ha_weather_temperature).state)) {
            snprintf(temp_str, sizeof(temp_str), "--°C");
          } else {
            snprintf(temp_str, sizeof(temp_str), "%.1f °C", id(ha_weather_temperature).state);
          }

          std::string header = is_local_web_radio ? "WEB RADIO " : "MUSIC ASSISTANT ";
          header += temp_str;
          bool show_weather_icon = true;

          std::string main_text;
          std::string subtitle;
          std::string detail;

          if (is_local_web_radio) {
            std::string label = id(local_radio_select).current_option();
            size_t dash = label.find(" - ");
            if (dash != std::string::npos) {
              label = label.substr(dash + 3);
            }
            main_text = label;
            subtitle = "Flux direct HTTP";
            detail = "Mode autonome";
          } else {
            const std::string title = valid(id(ma_media_title).state) ? id(ma_media_title).state : "";
            const std::string artist = valid(id(ma_media_artist).state) ? id(ma_media_artist).state : "";
            const std::string album = valid(id(ma_media_album).state) ? id(ma_media_album).state : "";
            const float duration_ms = id(ma_media_duration).state;
            const bool is_radio = !std::isfinite(duration_ms) || duration_ms <= 500.0f;

            if (is_radio) {
              main_text = album.empty() ? title : album;
              subtitle = album.empty() || title == album ? "" : title;
              detail = artist;
            } else {
              if (!album.empty()) {
                header = album;
                show_weather_icon = false;
              }
              main_text = artist.empty() ? title : artist;
              subtitle = artist.empty() ? "" : title;
              const int seconds = int(duration_ms / 1000.0f + 0.5f);
              char duration[24];
              snprintf(duration, sizeof(duration), "%d:%02d", seconds / 60, seconds % 60);
              detail = duration;
            }
          }

          display::BaseFont *main_font = id(ma_font_station);
          if (text_width(main_font, main_text) > w - 48) main_font = id(ma_font_heading);
          main_text = fit_text(main_font, main_text, w - 48);
          header = fit_text(id(ma_font_heading), header, show_weather_icon ? w - 64 : w - 32);
          subtitle = fit_text(id(ma_font_metadata), subtitle, w - 48);
          detail = fit_text(id(ma_font_status), detail, w - 48);

          it.filled_rectangle(0, 0, w, h, id(ma_bg));
          it.filled_rectangle(0, 0, w, 50, id(ma_header));
          it.filled_rectangle(0, 50, w, 3, id(ma_accent));
          it.filled_rectangle(12, 66, w - 24, 110, id(ma_panel));
          it.rectangle(12, 66, w - 24, 110, id(ma_accent));
          it.filled_rectangle(12, h - 50, w - 24, 40, id(ma_footer));

          const int header_w = text_width(id(ma_font_heading), header);
          const int header_x = (w / 2) - (show_weather_icon ? 14 : 0);
          it.printf(header_x, 13, id(ma_font_heading), id(ma_text), TextAlign::TOP_CENTER,
                    "%s", header.c_str());

          if (show_weather_icon && id(ha_weather_condition).has_state()) {
            const int icon_cx = header_x + (header_w / 2) + 16;
            const int icon_cy = 24;
            id(draw_weather_icon).execute(&it, icon_cx, icon_cy, id(ha_weather_condition).state);
          }

          it.printf(w / 2, 79, main_font, id(ma_text), TextAlign::TOP_CENTER,
                    "%s", main_text.c_str());
          it.printf(w / 2, 117, id(ma_font_metadata), id(ma_text_muted), TextAlign::TOP_CENTER,
                    "%s", subtitle.c_str());
          it.printf(w / 2, 146, id(ma_font_status), id(ma_text_muted), TextAlign::TOP_CENTER,
                    "%s", detail.c_str());

          const bool muted = is_local_web_radio ? id(mute) : id(sendspin_media_player).is_muted();
          const float volume = is_local_web_radio ? id(Vol) : id(sendspin_media_player).volume;
          const bool volume_known = std::isfinite(volume);
          const int volume_percent = volume_known ? int(clamp(volume, 0.0f, 1.0f) * 100 + 0.5f) : 0;
          if (muted) {
            it.print(24, h - 43, id(ma_font_status), id(ma_accent), "MUTED");
          } else if (volume_known) {
            it.printf(24, h - 43, id(ma_font_status), id(ma_text), "VOL %d%%", volume_percent);
          } else {
            it.print(24, h - 43, id(ma_font_status), id(ma_text_muted), "VOL --");
          }

          const int bar_x = 106;
          const int bar_w = w - 190;
          it.filled_rectangle(bar_x, h - 37, bar_w, 8, id(ma_bar_bg));
          const int filled = muted ? 0 : bar_w * volume_percent / 100;
          if (filled > 0) it.filled_rectangle(bar_x, h - 37, filled, 8, id(ma_bar_fill));
          if (id(usb_power_detect).state) {
            it.print(bar_x + bar_w / 2, h - 23, id(font_wifi_label), id(ma_text_muted),
                     TextAlign::TOP_CENTER, "USB");
          }

          if (!id(jack_detect).state) {
            it.print(bar_x + bar_w / 2, h - 49, id(font_wifi_label), id(ma_accent),
                     TextAlign::TOP_CENTER, "CASQUE");
          }
          
          const int battery_x = w - 57;
          const int battery_y = h - 43;
          it.rectangle(battery_x, battery_y, 30, 12, id(ma_text));
          it.filled_rectangle(battery_x + 30, battery_y + 4, 3, 4, id(ma_text));
          it.filled_rectangle(battery_x + 2, battery_y + 2, 26, 8, id(ma_bar_bg));
          const float battery = id(battery_percent).state;
          if (id(battery_percent).has_state() && std::isfinite(battery)) {
            const int percent = int(clamp(battery, 0.0f, 100.0f) + 0.5f);
            const Color battery_color = percent < 20 ? id(ma_battery_low) :
                percent < 50 ? id(ma_accent) : id(ma_bar_fill);
            const int battery_fill = 26 * percent / 100;
            if (battery_fill > 0) {
              it.filled_rectangle(battery_x + 2, battery_y + 2, battery_fill, 8, battery_color);
            }
            it.printf(battery_x + 15, battery_y + 13, id(ma_font_status), id(ma_text_muted),
                      TextAlign::TOP_CENTER, "%d%%", percent);
          } else {
            it.print(battery_x + 15, battery_y + 13, id(ma_font_status), id(ma_text_muted),
                     TextAlign::TOP_CENTER, "--%");
          }

      - id: wifiWaitingP
        lambda: |-
          const int w = it.get_width();
          const int h = it.get_height();
          it.filled_rectangle(0, 0, w, h, id(bg_blue));
          it.printf(w / 2, h / 2 - 12, id(font_request), id(white), TextAlign::CENTER, "Waiting WiFi...");
          it.printf(w / 2, h / 2 + 12, id(font_request), id(white), TextAlign::CENTER, "Connecting to network");

      - id: logoP
        lambda: |-
          it.image(0, 0, id(raspiIm));
          id(draw_status_overlay).execute(&it, false, false, false);

      - id: waitingP
        lambda: |-
          it.image(0, 0, id(WFWWIm));
          id(draw_status_overlay).execute(&it, true, true, true);

      - id: waitingBP
        lambda: |-
          it.image(0, 0, id(WIm));
          id(draw_status_overlay).execute(&it, true, true, true);

      - id: listeningP
        lambda: |-
          it.image(0, 0, id(LIm));
          id(draw_status_overlay).execute(&it, true, true, true);

      - id: answeringP
        lambda: |-
          it.image(0, 0, id(AIm));
          it.rectangle(20, 24, 280, 30, Color::BLACK);
          it.printf(30, 25, id(font_request), Color::BLACK, "%s", id(text_request).state.c_str());
          it.rectangle(20, 190, 280, 30, Color::BLACK);
          it.printf(30, 195, id(font_response), Color::BLACK, "%s", id(text_response).state.c_str());
          id(draw_status_overlay).execute(&it, true, true, true);

      - id: muteMicP
        lambda: |-
          it.image(0, 0, id(muteMicIm));
          id(draw_status_overlay).execute(&it, true, true, false);

      - id: clockP
        lambda: |-
          const int w = it.get_width();
          const int h = it.get_height();

          it.filled_rectangle(0, 0, w, h, id(ma_bg));
          it.filled_rectangle(12, 12, w - 24, h - 24, id(ma_panel));
          it.rectangle(12, 12, w - 24, h - 24, id(ma_accent));

          // 1. Badge Micro coupé (haut gauche)
          if (id(mic_muted)) {
            it.filled_rectangle(22, 18, 74, 22, id(ma_battery_low));
            it.printf(59, 29, id(ma_font_status), id(white), TextAlign::CENTER, "MIC OFF");
          }

          // 2. Badge Alarme Home Assistant (haut centre)
          //if (id(ha_alarm_active).state) {
          //  it.filled_rectangle(w / 2 - 30, 20, 60, 18, id(ma_accent));
          //  it.printf(w / 2, 22, id(font_wifi_label), id(ma_bg), TextAlign::TOP_CENTER, "ALARME");
          //}

          // 3. Badge Charge USB (haut droite)
          if (id(usb_power_detect).state) {
            it.filled_rectangle(w - 66, 18, 44, 22, id(ma_bar_fill));
            it.printf(w - 44, 29, id(ma_font_status), id(ma_bg), TextAlign::CENTER, "USB");
          }
          
          auto now = id(ha_time).now();
          char time_str[10];
          char date_str[32];

          if (now.is_valid()) {
            snprintf(time_str, sizeof(time_str), "%02d:%02d", now.hour, now.minute);
            static const char* jours[] = {"Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"};
            static const char* mois[] = {"Jan", "Fev", "Mar", "Avr", "Mai", "Juin", "Juil", "Aout", "Sept", "Oct", "Nov", "Dec"};
            const char* j = (now.day_of_week >= 1 && now.day_of_week <= 7) ? jours[now.day_of_week - 1] : "";
            const char* m = (now.month >= 1 && now.month <= 12) ? mois[now.month - 1] : "";
            snprintf(date_str, sizeof(date_str), "%s %d %s %d", j, now.day_of_month, m, now.year);
          } else {
            snprintf(time_str, sizeof(time_str), "--:--");
            snprintf(date_str, sizeof(date_str), "Synchronisation...");
          }

          // Heure centrale
          it.printf(w / 2, 46, id(clock_font_time), id(ma_text), TextAlign::TOP_CENTER, "%s", time_str);

          // Date sous l'heure
          it.printf(w / 2, 126, id(ma_font_heading), id(ma_accent), TextAlign::TOP_CENTER, "%s", date_str);

          // Ligne séparatrice basse
          it.filled_rectangle(28, 166, w - 56, 2, id(ma_bar_bg));

          // Météo en bas à gauche
          char temp_str[16];
          if (std::isnan(id(ha_weather_temperature).state)) {
            snprintf(temp_str, sizeof(temp_str), "--°C");
          } else {
            snprintf(temp_str, sizeof(temp_str), "%.1f °C", id(ha_weather_temperature).state);
          }
          it.printf(32, 184, id(ma_font_metadata), id(ma_text), TextAlign::TOP_LEFT, "%s", temp_str);

          if (id(ha_weather_condition).has_state()) {
            id(draw_weather_icon).execute(&it, 130, 193, id(ha_weather_condition).state);
          }

          // Batterie en bas à droite
          const int battery_x = w - 65;
          const int battery_y = 185;
          it.rectangle(battery_x, battery_y, 30, 12, id(ma_text));
          it.filled_rectangle(battery_x + 30, battery_y + 4, 3, 4, id(ma_text));
          it.filled_rectangle(battery_x + 2, battery_y + 2, 26, 8, id(ma_bar_bg));
          const float battery = id(battery_percent).state;
          if (id(battery_percent).has_state() && std::isfinite(battery)) {
            const int percent = int(clamp(battery, 0.0f, 100.0f) + 0.5f);
            const Color battery_color = percent < 20 ? id(ma_battery_low) :
                percent < 50 ? id(ma_accent) : id(ma_bar_fill);
            const int battery_fill = 26 * percent / 100;
            if (battery_fill > 0) {
              it.filled_rectangle(battery_x + 2, battery_y + 2, battery_fill, 8, battery_color);
            }
            it.printf(battery_x + 15, battery_y + 14, id(ma_font_status), id(ma_text_muted),
                      TextAlign::TOP_CENTER, "%d%%", percent);
          }
          
# === 4. CAPTEURS, ENCODEURS & BOUTONS ===

sensor:
  - platform: homeassistant
    id: ha_weather_temperature
    entity_id: *weather_entity
    attribute: temperature
    internal: false
    filters:
      - throttle: 15min

  - platform: sendspin
    id: ma_media_duration
    type: track_duration
    internal: true
    on_value:
      - script.execute: schedule_music_refresh

  - platform: rotary_encoder
    name: "Volume"
    id: volume_encoder
    pin_a:
      number: GPIO42
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO3
      mode:
        input: true
        pullup: true
    on_anticlockwise:
      then:
        - script.execute:
            id: adjust_volume
            delta: -0.05
    on_clockwise:
      then:
        - script.execute:
            id: adjust_volume
            delta: 0.05

  - platform: rotary_encoder
    name: "Station Selector"
    id: function_encoder
    resolution: 1
    pin_a:
      number: GPIO7
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO6
      mode:
        input: true
        pullup: true
    on_clockwise:
      then:
        - logger.log: "Station encoder -> NEXT"
        - select.next:
            id: local_radio_select
            cycle: true
    on_anticlockwise:
      then:
        - logger.log: "Station encoder -> PREV"
        - select.previous:
            id: local_radio_select
            cycle: true

  - platform: adc
    id: button_adc
    pin: GPIO1
    attenuation: auto
    update_interval: 50ms
    on_value_range:
      - above: 2.50
        then:
          - binary_sensor.template.publish:
              id: btn_confirm
              state: OFF
          - binary_sensor.template.publish:
              id: btn_1
              state: OFF
          - binary_sensor.template.publish:
              id: btn_2
              state: OFF
          - binary_sensor.template.publish:
              id: btn_3
              state: OFF
      - above: 0.35
        below: 0.55
        then:
          - binary_sensor.template.publish:
              id: btn_3
              state: ON
      - above: 0.72
        below: 0.95
        then:
          - binary_sensor.template.publish:
              id: btn_confirm
              state: ON
      - above: 1.40
        below: 1.70
        then:
          - binary_sensor.template.publish:
              id: btn_1
              state: ON
      - above: 1.85
        below: 2.15
        then:
          - binary_sensor.template.publish:
              id: btn_2
              state: ON

  - platform: adc
    pin: GPIO13
    name: Battery voltage
    device_class: voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    state_class: measurement
    entity_category: diagnostic
    update_interval: 15s
    attenuation: auto
    filters:
      - multiply: 2
      - calibrate_linear:
          - 0.0 -> 0.0
          - 4.58 -> 4.20
      - exponential_moving_average:
          alpha: 0.2
          send_every: 2
      - delta: 0.002
    on_value:
      then:
        - sensor.template.publish:
            id: battery_percent
            state: !lambda "return x;"
        - script.execute: request_display_update

  - platform: template
    name: Battery
    id: battery_percent
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    filters:
      - calibrate_polynomial:
          degree: 3
          datapoints:
            - 4.20 -> 100.0
            - 4.13 -> 97.1
            - 4.10 -> 94.2
            - 4.07 -> 88.4
            - 4.05 -> 82.7
            - 4.04 -> 76.9
            - 4.04 -> 71.1
            - 4.01 -> 65.3
            - 3.99 -> 59.5
            - 3.95 -> 53.8
            - 3.93 -> 48.0
            - 3.91 -> 42.2
            - 3.88 -> 36.4
            - 3.86 -> 30.6
            - 3.84 -> 24.9
            - 3.82 -> 19.1
            - 3.76 -> 13.3
            - 3.73 -> 10.4
            - 3.70 -> 7.5
            - 3.64 -> 4.6
            - 3.50 -> 1.7
            - 3.00 -> 0.0
      - lambda: return clamp(x, 0.0f, 100.0f);

  - platform: wifi_signal
    name: WiFi Signal
    id: wifi_signal_dbm
    update_interval: 15s
    on_value:
      then:
        - script.execute: request_display_update

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO21
      mode:
        input: true
    id: usb_power_detect
    name: USB Power
    device_class: power
    entity_category: diagnostic
    on_press:
      - logger.log: "USB power detected"
      - script.execute: request_display_update
    on_release:
      - logger.log: "USB power removed"
      - script.execute: request_display_update

  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
    id: jack_detect
    name: Jack Detect
    internal: true
    on_press:
      - script.execute: jack_detect_high
    on_release:
      - script.execute: jack_detect_low

  - platform: gpio
    pin:
      number: GPIO48
      inverted: true
      mode:
        input: true
        pullup: true
    id: click_vol
    name: Mute
    on_press:
      then:
        - script.execute: mute_unmute

  - platform: gpio
    pin:
      number: GPIO45
      inverted: true
      mode:
        input: true
        pullup: true
    id: click_sta
    name: Assist
    on_click:
      - min_length: 50ms
        max_length: 800ms
        then:
          - if:
              condition:
                lambda: |-
                  return id(music_active) ||
                      id(assist_return_to_ma) ||
                      id(assist_return_to_local_radio) ||
                      id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
              then:
                - script.execute: temporary_assist
              else:
                - script.execute: go_assist
      - min_length: 1000ms
        max_length: 4s
        then:
          - switch.toggle: mute_mic_switch

  - platform: template
    name: "Radio 1"
    id: btn_1
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute:
              id: play_radio_preset
              station: !lambda return id(radio_station_1).state;
      - min_length: 1800ms
        max_length: 8s
        then:
          - script.execute:
              id: save_radio_preset
              preset: 1

  - platform: template
    name: "Radio 2"
    id: btn_2
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute:
              id: play_radio_preset
              station: !lambda return id(radio_station_2).state;
      - min_length: 1800ms
        max_length: 8s
        then:
          - script.execute:
              id: save_radio_preset
              preset: 2

  - platform: template
    name: "Radio 3"
    id: btn_3
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute:
              id: play_radio_preset
              station: !lambda return id(radio_station_3).state;
      - min_length: 1800ms
        max_length: 8s
        then:
          - script.execute:
              id: save_radio_preset
              preset: 3

  - platform: template
    name: "Radio 4"
    id: btn_confirm
    filters:
      - delayed_on_off: 30ms
    on_click:
      - min_length: 50ms
        max_length: 1s
        then:
          - script.execute:
              id: toggle_local_radio
              # station_url: !lambda return id(radio_station_4).state;

switch:
  - platform: template
    name: "Mute Microphone"
    id: mute_mic_switch
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: 'id(mic_muted) = true;'
      - micro_wake_word.stop:
      - if:
          condition:
            lambda: 'return id(clock_screensaver_active);'
          then:
            - component.update: myDisplay
          else:
            - script.execute: reset_display
    on_turn_off:
      - lambda: 'id(mic_muted) = false;'
      - if:
          condition:
            lambda: 'return !id(music_active) && id(phase) == 1;'
          then:
            - micro_wake_word.start:
      - if:
          condition:
            lambda: 'return id(clock_screensaver_active);'
          then:
            - component.update: myDisplay
          else:
            - script.execute: reset_display

button:
  - platform: restart
    id: reboot_radio_btn
    name: "Restart Radio"
    icon: mdi:restart
              
number:
  - platform: template
    id: clock_brightness_day
    name: "Clock Brightness Day"
    icon: mdi:brightness-7
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 75
    unit_of_measurement: "%"
    on_value:
      - if:
          condition:
            lambda: 'return id(clock_screensaver_active);'
          then:
            - script.execute: update_clock_brightness

  - platform: template
    id: clock_brightness_night
    name: "Clock Brightness Night"
    icon: mdi:brightness-4
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 25
    unit_of_measurement: "%"
    on_value:
      - if:
          condition:
            lambda: 'return id(clock_screensaver_active);'
          then:
            - script.execute: update_clock_brightness

  - platform: template
    id: clock_standby_timeout
    name: "Clock Standby Timeout"
    icon: mdi:timer-cog-outline
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 5
    max_value: 600
    step: 5
    initial_value: 60
    unit_of_measurement: "s"
              
select:
  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);
