# === 5. SCRIPTS D'AFFICHAGE, RADIO & AUDIO ===

script:

  - id: draw_weather_icon
    parameters:
      it: display::Display*
      cx: int
      cy: int
      cond: string
    then:
      - lambda: |-
          auto draw_sun = [&](int x, int y, int r) {
            it->filled_circle(x, y, r, id(amber));
            for (int d = 0; d < 360; d += 45) {
              float rad = d * 3.14159265f / 180.0f;
              it->line(x + cosf(rad) * (r + 2), y + sinf(rad) * (r + 2),
                       x + cosf(rad) * (r + 5), y + sinf(rad) * (r + 5), id(amber));
            }
          };
          auto draw_cloud = [&](int x, int y, Color col) {
            it->filled_circle(x - 4, y + 1, 5, col);
            it->filled_circle(x + 2, y - 1, 6, col);
            it->filled_circle(x + 7, y + 2, 4, col);
            it->filled_rectangle(x - 4, y + 1, 12, 6, col);
          };

          if (cond == "sunny") {
            draw_sun(cx, cy, 5);
          } else if (cond == "clear-night") {
            it->filled_circle(cx, cy, 6, id(ma_accent));
            it->filled_circle(cx + 3, cy - 2, 5, id(ma_header));
          } else if (cond == "partlycloudy") {
            draw_sun(cx - 4, cy - 3, 4);
            draw_cloud(cx + 1, cy + 2, id(ma_text));
          } else if (cond == "cloudy" || cond == "fog") {
            draw_cloud(cx, cy, id(ma_text_muted));
          } else if (cond == "rainy" || cond == "pouring") {
            draw_cloud(cx, cy - 2, id(ma_text_muted));
            it->line(cx - 3, cy + 5, cx - 5, cy + 9, id(light_blue));
            it->line(cx + 1, cy + 5, cx - 1, cy + 9, id(light_blue));
            it->line(cx + 5, cy + 5, cx + 3, cy + 9, id(light_blue));
          } else if (cond == "lightning" || cond == "lightning-rainy") {
            draw_cloud(cx, cy - 2, id(ma_text_muted));
            it->line(cx + 1, cy + 3, cx - 2, cy + 7, id(amber));
            it->line(cx - 2, cy + 7, cx + 2, cy + 7, id(amber));
            it->line(cx + 2, cy + 7, cx - 1, cy + 11, id(amber));
          } else if (cond == "snowy" || cond == "snowy-rainy" || cond == "hail") {
            draw_cloud(cx, cy - 2, id(ma_text));
            it->draw_pixel_at(cx - 3, cy + 7, id(white));
            it->draw_pixel_at(cx + 1, cy + 8, id(white));
            it->draw_pixel_at(cx + 5, cy + 7, id(white));
          } else if (cond == "windy" || cond == "windy-variant") {
            it->line(cx - 7, cy - 3, cx + 5, cy - 3, id(ma_text_muted));
            it->line(cx - 5, cy + 1, cx + 8, cy + 1, id(ma_text_muted));
            it->line(cx - 7, cy + 5, cx + 3, cy + 5, id(ma_text_muted));
          } else {
            // Repli par défaut (nuage simple)
            draw_cloud(cx, cy, id(ma_text_muted));
          }

  - id: draw_status_overlay
    parameters:
      it: display::Display*
      show_battery: bool
      show_wifi: bool
      show_speaker: bool
    then:
      - lambda: |-
          const int w = it->get_width();
          const int h = it->get_height();

          // 1. Barre de volume temporaire
          if (id(volume_display_active) && w > 6 && h > 18) {
            const float vol = (id(mute) || id(auto_mute_active)) ? 0.0f : clamp(id(Vol), 0.0f, 1.0f);
            const int gauge_h = 18;
            const int margin = 3;
            const int gauge_y = h - gauge_h;
            const int inner_w = w - margin * 2;
            const int inner_h = gauge_h - margin * 2;
            const int filled_w = clamp(static_cast<int>(inner_w * vol + 0.5f), 0, inner_w);
            it->filled_rectangle(0, gauge_y, w, gauge_h, id(bg_charcoal));
            if (filled_w > 0) {
              it->filled_rectangle(margin, gauge_y + margin, filled_w, inner_h, id(lime));
            }
            it->rectangle(margin, gauge_y + margin, inner_w, inner_h, id(black));
          }

          // 2b. Indicateur Micro (à droite de l'icône haut-parleur, en haut à gauche)
          if (show_speaker && w > 64) {
            const int mx = 36, my = 6, mw = 20, mh = 20;
            auto mcol = id(mic_muted) ? id(red) : id(green);
            it->filled_rectangle(mx - 1, my - 1, mw + 2, mh + 2, id(black));
            it->filled_rectangle(mx, my, mw, mh, mcol);
            // Capsule du micro
            it->filled_rectangle(mx + 7, my + 3, 6, 8, id(black));
            // Pied du micro
            it->line(mx + 5, my + 9, mx + 5, my + 12, id(black));
            it->line(mx + 14, my + 9, mx + 14, my + 12, id(black));
            it->line(mx + 5, my + 12, mx + 14, my + 12, id(black));
            it->line(mx + 10, my + 12, mx + 10, my + 16, id(black));
            it->line(mx + 7, my + 16, mx + 13, my + 16, id(black));
            // Barre oblique si coupé
            if (id(mic_muted)) {
              it->line(mx + 2, my + 2, mx + mw - 3, my + mh - 3, id(black));
              it->line(mx + 3, my + 2, mx + mw - 2, my + mh - 3, id(black));
            }
          }

          // 2. Icône Haut-parleur
          if (show_speaker && w > 28) {
            const int x = 8, y = 6, iw = 20, ih = 20;
            auto col = (id(mute) && !id(auto_mute_active)) ? id(red) : id(green);
            for (int t = 1; t <= 2; t++) {
              it->rectangle(x - t, y + ih / 4 - t, iw, ih / 2 + t * 2, id(black));
              it->triangle(x, y + ih / 2, x + iw + t, y - t, x + iw + t, y + ih + t, id(black));
            }
            it->filled_rectangle(x, y + ih / 4, iw, ih / 2, col);
            it->filled_triangle(x, y + ih / 2, x + iw, y, x + iw, y + ih, col);
            it->line(x + iw / 2, y + ih / 4, x + iw / 2, y + ih * 3 / 4, id(black));
          }

          // 3. Icône Batterie
          const int bat_w = 34, bat_h = 14, cap_w = 4, margin = 4;
          const int bat_x = w - bat_w - cap_w - margin;
          const int bat_y = margin + 2;
          if (show_battery && w > bat_w + cap_w + margin * 2) {
            const int cap_h = bat_h / 2;
            it->rectangle(bat_x, bat_y, bat_w, bat_h, id(black));
            it->filled_rectangle(bat_x + bat_w, bat_y + (bat_h - cap_h) / 2, cap_w, cap_h, id(black));
            const int inner_w = bat_w - 4, inner_h = bat_h - 4;
            it->filled_rectangle(bat_x + 2, bat_y + 2, inner_w, inner_h, id(bg_charcoal));

            if (id(battery_percent).has_state()) {
              const float pct = clamp(id(battery_percent).state, 0.0f, 100.0f);
              auto col = pct < 20.0f ? id(red) : (pct < 50.0f ? id(amber) : id(lime));
              const int fill_w = clamp(static_cast<int>(inner_w * (pct / 100.0f) + 0.5f), 0, inner_w);
              if (fill_w > 0) it->filled_rectangle(bat_x + 2, bat_y + 2, fill_w, inner_h, col);

              const int cx = bat_x + bat_w / 2;
              const int cy = bat_y + bat_h / 2 + 1;
              if (id(usb_power_detect).state) {
                it->filled_rectangle(bat_x + 1, bat_y + 1, bat_w - 2, bat_h - 2, id(light_green));
                const int bw = 24, bh = 8, left = cx - bw / 2, top = cy - bh / 2 - 1;
                it->filled_triangle(left + bw / 2, top, left + bw, top + bh / 2, left + bw / 2, top + bh / 2, id(black));
                it->filled_triangle(left + bw / 2, top + bh, left, top + bh / 2, left + bw / 2, top + bh / 2, id(black));
              } else {
                it->printf(cx, cy, id(font_battery_small), id(black), TextAlign::CENTER, "%.0f%%", pct);
              }
            }
          }

          // 4. Icône Wi-Fi
          if (show_wifi && id(wifi_signal_dbm).has_state()) {
            const float rssi = id(wifi_signal_dbm).state;
            auto col = rssi > -60.0f ? id(lime) : (rssi > -75.0f ? id(amber) : id(red));
            const int bars = rssi > -60.0f ? 3 : (rssi > -75.0f ? 2 : 1);
            const int dot_x = bat_x - 21;
            const int dot_y = bat_y + bat_h - 1;
            it->filled_rectangle(dot_x - 1, dot_y - 1, 3, 3, col);

            const float pi = 3.14159265f;
            for (int b = 1; b <= bars; b++) {
              const int radius = 1 + b * 3;
              for (int t = 0; t < 2; t++) {
                const int r = radius - t;
                bool has_prev = false;
                int prev_x = 0, prev_y = 0;
                for (float deg = 200.0f; deg <= 340.0f; deg += 5.0f) {
                  const float rad = deg * pi / 180.0f;
                  const int px = dot_x + static_cast<int>(roundf(cosf(rad) * r));
                  const int py = dot_y + static_cast<int>(roundf(sinf(rad) * r));
                  if (has_prev) it->line(prev_x, prev_y, px, py, col);
                  prev_x = px; prev_y = py; has_prev = true;
                }
              }
            }
          }

  - id: show_preset_feedback
    mode: restart
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - lambda: |-
          id(lightTO) = 0;
          if (id(myDisplay).is_ready()) {
            id(myDisplay).show_page(presetP);
            id(myDisplay).update();
          }
      - delay: 2500ms
      - script.execute: reset_display

  - id: play_france_info
    mode: restart
    then:
      - script.execute:
          id: play_radio_preset
          station: library://radio/1

  - id: play_france_inter
    mode: restart
    then:
      - script.execute:
          id: play_radio_preset
          station: library://radio/2

  - id: play_france_musique
    mode: restart
    then:
      - script.execute:
          id: play_radio_preset
          station: library://radio/4

  - id: play_nostalgie
    mode: restart
    then:
      - script.execute:
          id: play_radio_preset
          station: library://radio/7

  - id: play_radio_classique
    mode: restart
    then:
      - script.execute:
          id: play_radio_preset
          station: library://radio/8

  - id: preview_selected_station
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(local_radio_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - lambda: |-
                std::string label = id(local_radio_select).current_option();
                // Retire le préfixe "X - " pour un affichage plus propre
                size_t dash = label.find(" - ");
                if (dash != std::string::npos) {
                  label = label.substr(dash + 3);
                }
                id(preset_message) = label;
            - script.execute: show_preset_feedback

  - id: debounced_switch_local_radio
    mode: restart
    then:
      - delay: 600ms
      - if:
          condition:
            lambda: 'return id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;'
          then:
            - media_player.stop:
                id: local_radio_player
                announcement: false
            - delay: 250ms
            - script.execute: toggle_local_radio
              
  - id: play_radio_preset
    mode: restart
    parameters:
      station: string
    then:
      - lambda: 'ESP_LOGI("play_radio_preset", "Lancement station : %s", station.c_str());'
      - if:
          condition:
            lambda: |-
              return id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                     id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;
          then:
            - media_player.stop:
                id: local_radio_player
                announcement: false
            - delay: 200ms
      - if:
          condition:
            lambda: return station.find_first_not_of(" \t\r\n") != std::string::npos;
          then:
            - lambda: 'id(preset_message) = "LOADING...";'
            - script.execute: show_preset_feedback
            - homeassistant.action:
                action: media_player.play_media
                data:
                  media_content_type: radio
                  enqueue: replace
                data_template:
                  entity_id: |-
                    {% set configured = player_entity | trim %}
                    {% if configured and states(configured) not in ['unknown', 'unavailable'] %}
                      {{ configured }}
                    {% else %}
                      {% set ns = namespace(entity_id='') %}
                      {% for player in states.media_player %}
                        {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                        {% if ns.entity_id == '' and player.state not in ['unknown', 'unavailable']
                              and 'raspiaudio' in label %}
                          {% set ns.entity_id = player.entity_id %}
                        {% endif %}
                      {% endfor %}
                      {% if ns.entity_id == '' %}
                        {% for player in states.media_player %}
                          {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                          {% if ns.entity_id == '' and player.state not in ['unknown', 'unavailable']
                                and 'radio' in label %}
                            {% set ns.entity_id = player.entity_id %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                      {{ ns.entity_id }}
                    {% endif %}
                  media_content_id: '{{ station_name }}'
                variables:
                  station_name: !lambda return station;
                  player_entity: !lambda return id(ma_player_entity_id);
                on_error:
                  - lambda: |-
                      id(preset_message) = "PLAY FAILED";
                      ESP_LOGW("radio_preset", "Erreur lecture station : %s", error.c_str());
                  - script.execute: show_preset_feedback
          else:
            - lambda: 'id(preset_message) = "NO RADIO";'
            - script.execute: show_preset_feedback

  - id: save_radio_preset
    mode: restart
    parameters:
      preset: int
    then:
      - logger.log:
          format: "Appui long détecté -> sauvegarde preset %d"
          args: ['preset']
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - homeassistant.action:
          action: music_assistant.get_queue
          data_template:
            entity_id: |-
              {% set configured = player_entity | trim %}
              {% if configured and states(configured) not in ['unknown', 'unavailable'] %}
                {{ configured }}
              {% else %}
                {% set ns = namespace(raspiaudio='', named='', metadata='') %}
                {% for player in states.media_player %}
                  {% if player.state not in ['unknown', 'unavailable'] %}
                    {% set label = (player.entity_id ~ ' ' ~ player.name) | lower %}
                    {% set same_album = current_album | length > 0
                          and player.attributes.media_album_name | default('') == current_album %}
                    {% set same_title = current_title | length > 0
                          and player.attributes.media_title | default('') == current_title %}
                    {% if ns.raspiaudio == '' and 'raspiaudio' in label %}
                      {% set ns.raspiaudio = player.entity_id %}
                    {% endif %}
                    {% if ns.named == '' and 'radio' in label %}
                      {% set ns.named = player.entity_id %}
                    {% endif %}
                    {% if ns.metadata == '' and (same_album or same_title) %}
                      {% set ns.metadata = player.entity_id %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.raspiaudio if ns.raspiaudio else (ns.named if ns.named else ns.metadata) }}
              {% endif %}
          variables:
            player_entity: !lambda return id(ma_player_entity_id);
            current_title: !lambda return id(ma_media_title).state;
            current_album: !lambda return id(ma_media_album).state;
          capture_response: true
          response_template: |-
            {% set entity_id = response.keys() | list | first | default('') %}
            {% set q = response.get(entity_id, {}) if entity_id else {} %}
            {% set item = q.get('current_item') or {} %}
            {% set media_item = item.get('media_item') or {} %}
            {% set uri = media_item.get('uri') or item.get('uri') or state_attr(entity_id, 'media_content_id') or '' %}
            {{ entity_id }}|@|{{ uri }}
          on_success:
            - lambda: |-
                std::string payload;
                if (response["response"].is<const char*>()) {
                  payload = response["response"].as<std::string>();
                } else {
                  serializeJson(response, payload);
                }
                ESP_LOGI("radio_preset", "Réponse MA brute : %s", payload.c_str());

                const size_t separator = payload.find("|@|");
                const std::string entity_id = separator == std::string::npos
                    ? "" : payload.substr(0, separator);
                const std::string uri = separator == std::string::npos
                    ? "" : payload.substr(separator + 3);
                const bool valid = !entity_id.empty() && !uri.empty() &&
                                   uri.find("://") != std::string::npos;
                if (!valid) {
                  id(preset_message) = "NO RADIO";
                  ESP_LOGW("radio_preset", "Aucune station exploitable dans : %s", payload.c_str());
                  return;
                }
                if (uri.size() > 255) {
                  id(preset_message) = "URI TOO LONG";
                  ESP_LOGW("radio_preset", "Station URI exceeds the 255-byte preset limit");
                  return;
                }

                text::Text *target = nullptr;
                if (preset == 1) target = id(radio_station_1);
                else if (preset == 2) target = id(radio_station_2);
                else if (preset == 3) target = id(radio_station_3);
                else if (preset == 4) target = id(radio_station_4);
                if (target == nullptr) return;

                id(ma_player_entity_id) = entity_id;
                auto call = target->make_call();
                call.set_value(uri);
                call.perform();
                id(preset_message) = "MEMO " + std::to_string(preset) + " OK";
                ESP_LOGI("radio_preset", "Station %s enregistrée sur bouton %d via %s",
                         uri.c_str(), preset, entity_id.c_str());
            - script.execute: show_preset_feedback
          on_error:
            - lambda: |-
                id(preset_message) = "NO RADIO";
                ESP_LOGW("radio_preset", "Erreur lecture file MA : %s", error.c_str());
            - script.execute: show_preset_feedback

  - id: schedule_music_refresh
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition:
            lambda: |-
              return id(music_active) &&
                  !id(assist_return_to_ma) &&
                  !id(assist_return_to_local_radio) &&
                  id(myDisplay).is_ready();
          then:
            - script.execute: reset_display

  - id: stop_and_restart_local_radio
    mode: restart
    then:
      - media_player.stop:
          id: local_radio_player
          announcement: false
      - delay: 250ms
      - script.execute: toggle_local_radio

  - id: toggle_local_radio
    mode: restart
    then:
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - lambda: 'id(lightTO) = 0;'
      - if:
          condition:
            lambda: |-
              return id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                     id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;
          then:
            - logger.log: "Arrêt de la radio web locale"
            - media_player.stop:
                id: local_radio_player
                announcement: false
            - delay: 200ms
            - lambda: |-
                id(music_active) = (id(music_source_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
                id(preset_message) = "STOP RADIO";
                if (id(myDisplay).is_ready()) {
                  id(myDisplay).show_page(presetP);
                  id(myDisplay).update();
                }
            - delay: 1500ms
            - lambda: |-
                if (!id(music_active)) {
                  id(phase) = 1;
                  id(lightTO) = 0;
                  id(clock_screensaver_active) = true;
                  if (id(myDisplay).is_ready()) {
                    id(myDisplay).show_page(clockP);
                    id(myDisplay).update();
                  }
                }
            - script.execute: update_clock_brightness
          else:
            - if:
                condition:
                  lambda: |-
                    const int custom_idx = static_cast<int>(id(local_radio_select).size()) - 1;
                    auto idx = id(local_radio_select).active_index();
                    const int i = idx.has_value() ? static_cast<int>(idx.value()) : 0;
                    if (i == custom_idx) {
                      return id(radio_station_4).state.find_first_not_of(" \t\r\n") != std::string::npos;
                    }
                    return true;
                then:
                  - logger.log: "Démarrage de la radio web locale"
                  - if:
                      condition:
                        lambda: |-
                          return id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                                 id(music_source_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
                      then:
                        - media_player.pause: sendspin_media_player
                        - media_player.stop: music_source_player
                        - wait_until:
                            condition:
                              lambda: 'return id(music_source_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;'
                            timeout: 4s
                        - delay: 150ms
                  - media_player.stop:
                      id: local_radio_player
                      announcement: false
                  - delay: 150ms
                  - micro_wake_word.stop:
                  - script.execute: apply_local_codec_volume
                  - media_player.volume_set:
                      id: local_radio_player
                      volume: !lambda 'return id(Vol);'
                  - media_player.play_media:
                      id: local_radio_player
                      announcement: false
                      media_url: !lambda |-
                        static const std::vector<std::string> urls = {
                          "${st_1_url}",
                          "${st_2_url}",
                          "${st_3_url}",
                          "${st_4_url}",
                          "${st_5_url}",
                          "${st_6_url}",
                          "${st_7_url}",
                          "${st_8_url}",
                          "${st_9_url}"
                        };
                        const int count = static_cast<int>(urls.size());
                        const int custom_idx = static_cast<int>(id(local_radio_select).size()) - 1;
                        auto idx = id(local_radio_select).active_index();
                        const int i = idx.has_value() ? static_cast<int>(idx.value()) : 0;
                        if (i == custom_idx) {
                          return id(radio_station_4).state;
                        }
                        if (i >= 0 && i < count) {
                          return urls.at(i);
                        }
                        return urls.front();
                  - delay: 100ms
                  - media_player.volume_set:
                      id: local_radio_player
                      volume: !lambda 'return id(Vol);'
                  - speaker.volume_set:
                      id: radio_speaker
                      volume: !lambda 'return id(Vol);'
                  - lambda: |-
                      std::string label = id(local_radio_select).current_option();
                      size_t dash = label.find(" - ");
                      if (dash != std::string::npos) {
                        label = label.substr(dash + 3);
                      }
                      for (auto &c : label) {
                        c = std::toupper(static_cast<unsigned char>(c));
                      }
                      id(preset_message) = label.empty() ? "WEB RADIO" : label;
                  - script.execute: show_preset_feedback
                else:
                  - lambda: 'id(preset_message) = "NO RADIO";'
                  - script.execute: show_preset_feedback
              
  - id: temporary_assist
    mode: single
    then:
      - if:
          condition:
            not:
              voice_assistant.connected:
          then:
            - lambda: 'id(preset_message) = "HA OFFLINE";'
            - script.execute: show_preset_feedback
            - script.stop: temporary_assist
      - if:
          condition:
            lambda: 'return id(assist_return_to_ma) || id(assist_return_to_local_radio);'
          then:
            - voice_assistant.stop:
          else:
            - lambda: |-
                const bool was_local =
                    id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                    id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;
                id(assist_return_to_local_radio) = was_local;
                id(assist_return_to_ma) = !was_local;
                id(assist_left_ma_group) = false;
                id(phase) = 3;
            - if:
                condition:
                  lambda: 'return id(assist_return_to_local_radio);'
                then:
                  - media_player.stop:
                      id: local_radio_player
                      announcement: false
                else:
                  - media_player.pause: sendspin_media_player
                  - wait_until:
                      condition:
                        lambda: |-
                          return id(sendspin_media_player).state !=
                              media_player::MEDIA_PLAYER_STATE_PLAYING;
                      timeout: 8s
                  - if:
                      condition:
                        lambda: |-
                          return id(sendspin_media_player).state ==
                              media_player::MEDIA_PLAYER_STATE_PLAYING;
                      then:
                        - logger.log:
                            level: ERROR
                            format: "Assist cancelled: Sendspin group did not pause"
                        - lambda: 'id(assist_return_to_ma) = false;'
                        - script.execute: reset_display
                        - script.stop: temporary_assist
            - wait_until:
                condition:
                  lambda: 'return !id(music_active) && id(radio_speaker).is_stopped();'
                timeout: 6s
            - if:
                condition:
                  lambda: 'return id(music_active) || !id(radio_speaker).is_stopped();'
                then:
                  - if:
                      condition:
                        lambda: 'return id(assist_return_to_ma);'
                      then:
                        - lambda: 'id(assist_left_ma_group) = true;'
                        - media_player.stop: music_source_player
                  - wait_until:
                      condition:
                        lambda: 'return !id(music_active) && id(radio_speaker).is_stopped();'
                      timeout: 6s
            - if:
                condition:
                  lambda: 'return id(music_active) || !id(radio_speaker).is_stopped();'
                then:
                  - logger.log:
                      level: ERROR
                      format: "Assist cancelled: Radio did not release the I2S bus"
                  - if:
                      condition:
                        lambda: 'return id(assist_return_to_local_radio);'
                      then:
                        - lambda: 'id(assist_return_to_local_radio) = false;'
                        - script.execute: toggle_local_radio
                      else:
                        - lambda: 'id(assist_return_to_ma) = false;'
                        - if:
                            condition:
                              lambda: 'return id(assist_left_ma_group);'
                            then:
                              - sendspin.switch: sendspin_hub
                        - media_player.play: sendspin_media_player
                        - script.execute: reset_display
                else:
                  - light.turn_on: screen_backlight
                  - script.execute: reset_display
                  - voice_assistant.start:
                      silence_detection: true

  - id: finish_temporary_assist
    mode: single
    then:
      - wait_until:
          condition:
            not:
              voice_assistant.is_running:
          timeout: 10s
      - if:
          condition:
            lambda: 'return id(assist_return_to_local_radio);'
          then:
            - lambda: |-
                id(assist_return_to_local_radio) = false;
                id(phase) = 1;
            - micro_wake_word.stop:
            - wait_until:
                condition:
                  not:
                    micro_wake_word.is_running:
                timeout: 3s
            - delay: 200ms
            - script.execute: toggle_local_radio
          else:
            - if:
                condition:
                  lambda: 'return id(assist_return_to_ma);'
                then:
                  - lambda: |-
                      id(assist_return_to_ma) = false;
                      id(phase) = 1;
                  - micro_wake_word.stop:
                  - wait_until:
                      condition:
                        not:
                          micro_wake_word.is_running:
                      timeout: 3s
                  - delay: 200ms
                  - if:
                      condition:
                        lambda: 'return id(assist_left_ma_group);'
                      then:
                        - sendspin.switch: sendspin_hub
                        - delay: 300ms
                  - media_player.play: sendspin_media_player
                  - wait_until:
                      condition:
                        lambda: 'return id(music_active);'
                      timeout: 8s
                  - lambda: 'id(assist_left_ma_group) = false;'
                  - script.execute: reset_display

  - id: go_assist
    then:
      - if:
          condition:
            not:
              voice_assistant.connected:
          then:
            - lambda: 'id(preset_message) = "HA OFFLINE";'
            - script.execute: show_preset_feedback
            - script.stop: go_assist
      - light.turn_on: screen_backlight
      - lambda: 'id(lightTO) = 0;'
      - if:
          condition:
            lambda: 'return (id(phase) == 3 || id(phase) == 4);'
          then:
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - voice_assistant.stop:
                  - wait_until:
                      not:
                        voice_assistant.is_running:
            - if:
                condition:
                  media_player.is_announcing:
                    id: speaker_media_player
                then:
                  - media_player.stop:
                      id: speaker_media_player
                      announcement: true
            - if:
                condition:
                  media_player.is_playing:
                    id: speaker_media_player
                then:
                  - media_player.stop:
                      id: speaker_media_player
            - micro_wake_word.start:
            - lambda: |-
                id(mute) = false;
                id(auto_mute_active) = false;
                id(phase) = 1;
            - script.execute: reset_display
          else:
            - if:
                condition:
                  media_player.is_announcing:
                    id: speaker_media_player
                then:
                  - media_player.stop:
                      id: speaker_media_player
                      announcement: true
            - if:
                condition:
                  media_player.is_playing:
                    id: speaker_media_player
                then:
                  - media_player.stop:
                      id: speaker_media_player
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - voice_assistant.stop:
                  - wait_until:
                      not:
                        voice_assistant.is_running:
            - micro_wake_word.stop:
            - lambda: 'id(phase) = 3;'
            - script.execute: reset_display
            - voice_assistant.start:

  - id: request_display_update
    mode: restart
    then:
      - delay: 50ms
      - lambda: |-
          if (id(myDisplay).is_ready()) {
            id(myDisplay).update();
          }

  - id: mute_unmute
    then:
      - light.turn_on: screen_backlight
      - lambda: 'id(lightTO) = 0;'
      - if:
          condition:
            lambda: |-
              return !id(assist_return_to_ma) &&
                  (id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                   id(music_source_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - if:
                condition:
                  media_player.is_muted: sendspin_media_player
                then:
                  - media_player.unmute: sendspin_media_player
                else:
                  - media_player.mute: sendspin_media_player
            - script.execute: schedule_music_refresh
          else:
            - if:
                condition:
                  lambda: 'return id(mute);'
                then:
                  - logger.log: "unmute!"
                  - script.execute: apply_local_codec_volume
                  - media_player.volume_set:
                      id: speaker_media_player
                      volume: !lambda 'return id(Vol);'
                  - media_player.volume_set:
                      id: local_radio_player
                      volume: !lambda 'return id(Vol);'
                  - lambda: |-
                      id(mute) = false;
                      id(auto_mute_active) = false;
                else:
                  - logger.log: "mute!"
                  - media_player.volume_set:
                      id: speaker_media_player
                      volume: '0'
                  - media_player.volume_set:
                      id: local_radio_player
                      volume: '0'
                  - lambda: |-
                      id(mute) = true;
                      id(auto_mute_active) = false;
      - lambda: |-
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
      - script.execute: schedule_volume_update
      - script.execute: reset_display

  - id: jack_detect_high
    then:
      - logger.log: "Jack detect high -> route to speaker"
      - output.turn_off: dac_mute
      - lambda: |-
          id(my_es8388).write_byte(0x1D, 0x20);
          id(my_es8388).write_byte(0x1C, 0x10);
          id(my_es8388).write_byte(0x04, 0x30);
      - if:
          condition:
            lambda: 'return id(phase) != 0;'
          then:
            - lambda: 'id(preset_message) = "HAUT-PARLEUR";'
            - script.execute: show_preset_feedback

  - id: jack_detect_low
    then:
      - logger.log: "Jack detect low -> route to line out"
      - output.turn_on: dac_mute
      - lambda: |-
          id(my_es8388).write_byte(0x1D, 0x00);
          id(my_es8388).write_byte(0x1C, 0x00);
          id(my_es8388).write_byte(0x04, 0x0C);
      - if:
          condition:
            lambda: 'return id(phase) != 0;'
          then:
            - lambda: 'id(preset_message) = "CASQUE";'
            - script.execute: show_preset_feedback

  - id: adjust_volume
    parameters:
      delta: float
    then:
      - light.turn_on: screen_backlight
      - if:
          condition:
            lambda: |-
              return !id(assist_return_to_ma) &&
                  (id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                   id(music_source_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
          then:
            - media_player.volume_set:
                id: sendspin_media_player
                volume: !lambda |-
                  const float reported = id(sendspin_media_player).volume;
                  int current = std::isfinite(reported)
                      ? static_cast<int>(std::roundf(clamp(reported, 0.0f, 1.0f) * 100.0f))
                      : 0;
                  const uint32_t now = millis();
                  if (id(ma_volume_target_percent) >= 0 &&
                      now - id(ma_volume_last_command_ms) < 700) {
                    current = id(ma_volume_target_percent);
                  }
                  int step = static_cast<int>(std::roundf(delta *
                      (current <= 20 ? 20.0f : 100.0f)));
                  int next = current + step;
                  if (step < 0 && current > 20 && next < 20)
                    next = 20;
                  next = clamp(next, 0, 100);
                  id(ma_volume_target_percent) = next;
                  id(ma_volume_last_command_ms) = now;
                  return next / 100.0f;
            - media_player.unmute: sendspin_media_player
            - lambda: 'id(lightTO) = 0;'
            - script.execute: schedule_music_refresh
            - script.stop: adjust_volume
      - lambda: |-
          id(lightTO) = 0;
          float scale = 1.0f;
          if (id(Vol) <= 0.20f) scale = 0.20f;
          else if (id(Vol) < 0.3f) scale = 0.50f;
          else if (id(Vol) < 0.5f) scale = 0.60f;

          const float current = id(Vol);
          id(Vol) += delta * scale;
          if (delta < 0.0f && current > 0.20f && id(Vol) < 0.20f)
            id(Vol) = 0.20f;
          id(Vol) = clamp(id(Vol), 0.0f, 1.0f);
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
          id(mute) = false;
      - script.execute: apply_local_codec_volume
      - media_player.volume_set:
          id: speaker_media_player
          volume: !lambda return id(Vol);
      - media_player.volume_set:
          id: local_radio_player
          volume: !lambda return id(Vol);
      - script.execute: schedule_volume_update
      - script.execute: reset_display

  - id: schedule_volume_update
    then:
      - lambda: |-
          if (id(volume_display_active) && id(myDisplay).is_ready()) {
            id(myDisplay).update();
          }

  - id: apply_local_codec_volume
    then:
      - lambda: |-
          const int percent = static_cast<int>(std::roundf(clamp(id(Vol), 0.0f, 1.0f) * 100.0f));
          const uint8_t codec_volume = id(Vol) < 0.10f ? 23 + percent : 33;
          for (uint8_t reg = 0x2E; reg <= 0x31; reg++) {
            id(my_es8388).write_byte(reg, codec_volume);
          }

  - id: reset_display
    then:
      - logger.log: "===> reset_display"
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - lambda: |-
          id(lightTO) = 0;
          id(clock_screensaver_active) = false;
          const bool in_temp_assist = id(assist_return_to_ma) || id(assist_return_to_local_radio);
          if ((id(music_active) ||
               id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) &&
              !in_temp_assist) {
            id(myDisplay).show_page(musicP);
            id(myDisplay).update();
            return;
          }
          if (id(mic_muted) && !id(clock_screensaver_active)) {
            id(myDisplay).show_page(muteMicP);
            id(myDisplay).update();
            return;
          }

          if ((id(phase) == 0) && (!id(logo).is_running())) {
            id(logo).execute();
          } else if (id(phase) == 1) {
            id(waiting).execute();
          } else if (id(phase) == 2) {
            id(external_player).execute();
          } else if (id(phase) == 3) {
            id(listening).execute();
          } else if (id(phase) == 4) {
            id(answering).execute();
          }

  - id: logo
    then:
      - logger.log: "===> logo"
      - media_player.volume_set:
          id: speaker_media_player
          volume: !lambda 'return std::min(id(Vol), 0.20f);'
      - delay: 150ms
      - media_player.speaker.play_on_device_media_file:
          id: speaker_media_player
          media_file: little_sound
          announcement: false
      - lambda: |-
          id(myDisplay).show_page(logoP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight
      - delay: 2s
      - media_player.volume_set:
          id: speaker_media_player
          volume: !lambda 'return id(Vol);'
      - delay: 6s
      - script.execute: wait_for_wifi_ready

  - id: wait_for_wifi_ready
    mode: restart
    then:
      - logger.log: "Waiting for WiFi before entering waiting state"
      - while:
          condition:
            not:
              wifi.connected:
          then:
            - lambda: |-
                id(myDisplay).show_page(wifiWaitingP);
                id(myDisplay).update();
                id(lightTO) = 0;
            - light.turn_on: screen_backlight
            - delay: 1s
      - logger.log: "WiFi connected, moving to waiting state"
      - lambda: 'id(phase) = 1;'
      - script.execute: reset_display

  - id: update_playback_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(music_active);'
          then:
            - script.stop: enter_idle_mode
            - lambda: |-
                id(mute) = false;
                id(auto_mute_active) = false;
            - speaker.volume_set:
                id: radio_speaker
                volume: !lambda |-
                  if (id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
                    return clamp(id(Vol), 0.0f, 1.0f);
                  }
                  const float volume = id(sendspin_media_player).volume;
                  return std::isfinite(volume) ? clamp(volume, 0.0f, 1.0f) : 1.0f;
            - if:
                condition:
                  lambda: 'return id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;'
                then:
                  - script.execute: apply_local_codec_volume
                else:
                  - lambda: |-
                      for (uint8_t reg = 0x2E; reg <= 0x31; reg++) {
                        id(my_es8388).write_byte(reg, 0x21);
                      }
            - micro_wake_word.stop:
            - if:
                condition:
                  lambda: 'return !id(assist_return_to_ma) && !id(assist_return_to_local_radio);'
                then:
                  - lambda: 'id(phase) = 5;'
                  - script.execute: schedule_music_refresh
          else:
            - script.execute: enter_idle_mode

  - id: enter_idle_mode
    mode: restart
    then:
      - delay: 1200ms
      - wait_until:
          condition:
            lambda: 'return id(radio_speaker).is_stopped();'
          timeout: 4s
      - if:
          condition:
            lambda: |-
              return !id(music_active) &&
                  !id(assist_return_to_ma) &&
                  !id(assist_return_to_local_radio) &&
                  id(sendspin_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING &&
                  id(radio_speaker).is_stopped();
          then:
            - lambda: 'id(phase) = 1;'
            - script.execute: reset_display
            - lambda: |-
                const int timeout = static_cast<int>(id(clock_standby_timeout).state);
                id(lightTO) = std::max(0, timeout - 5);

  - id: waiting
    mode: restart
    then:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - delay: 1s
            - voice_assistant.stop:
      - script.execute: mute_on
      - logger.log: "===> wakeword"
      - lambda: |-
          id(myDisplay).show_page(waitingP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight
      - wait_until:
          condition:
            lambda: |-
              return id(radio_speaker).is_stopped() || id(music_active) ||
                  id(assist_return_to_ma) || id(assist_return_to_local_radio) || id(va).is_running();
          timeout: 8s
      - if:
          condition:
            and:
              - lambda: |-
                  return !id(music_active) && !id(mic_muted) &&
                      !id(assist_return_to_ma) && !id(assist_return_to_local_radio) &&
                      !id(va).is_running() &&
                      id(sendspin_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING &&
                      id(radio_speaker).is_stopped();
              - not:
                  micro_wake_word.is_running:
          then:
            - micro_wake_word.start:

  - id: listening
    mode: restart
    then:
      - logger.log: "===> listening"
      - script.execute: mute_on
      - lambda: |-
          id(myDisplay).show_page(listeningP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight

  - id: answering
    mode: restart
    then:
      - logger.log: "===> answering"
      - script.execute: mute_off
      - lambda: |-
          id(myDisplay).show_page(answeringP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight
      - delay: 10s

  - id: external_player
    mode: restart
    then:
      - logger.log: "===> front end player"
      - lambda: |-
          id(myDisplay).show_page(waitingBP);
          id(myDisplay).update();
          id(lightTO) = 0;
      - light.turn_on: screen_backlight

  - id: mute_on
    then:
      - if:
          condition:
            lambda: 'return !id(auto_mute_active);'
          then:
            - media_player.volume_set:
                id: speaker_media_player
                volume: '0'
      - lambda: |-
          id(mute) = true;
          id(auto_mute_active) = true;
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
      - script.execute: schedule_volume_update

  - id: mute_off
    then:
      - if:
          condition:
            lambda: 'return id(auto_mute_active);'
          then:
            - script.execute: apply_local_codec_volume
            - media_player.volume_set:
                id: speaker_media_player
                volume: !lambda return(id(Vol));
      - lambda: |-
          id(mute) = false;
          id(auto_mute_active) = false;
          id(volume_display_active) = true;
          id(volume_display_timer) = 0;
      - script.execute: schedule_volume_update

  - id: update_clock_brightness
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(clock_screensaver_active);'
          then:
            - if:
                condition:
                  - sun.is_above_horizon:
                then:
                  - light.turn_on:
                      id: screen_backlight
                      brightness: !lambda 'return id(clock_brightness_day).state / 100.0f;'
                else:
                  - light.turn_on:
                      id: screen_backlight
                      brightness: !lambda 'return id(clock_brightness_night).state / 100.0f;'

  - id: cycle_ma_preset
    mode: restart
    parameters:
      delta: int
    then:
      - lambda: |-
          if (id(current_ma_preset) < 1 || id(current_ma_preset) > 3) {
            id(current_ma_preset) = (delta > 0) ? 1 : 3;
          } else {
            int next = id(current_ma_preset) + delta;
            if (next > 3) next = 1;
            if (next < 1) next = 3;
            id(current_ma_preset) = next;
          }
          std::string station;
          if (id(current_ma_preset) == 1) station = id(radio_station_1).state;
          else if (id(current_ma_preset) == 2) station = id(radio_station_2).state;
          else station = id(radio_station_3).state;

          ESP_LOGI("ir_preset", "Cycle MA preset -> %d", id(current_ma_preset));
          id(play_radio_preset).execute(station);

  - id: stop_all_playback
    mode: restart
    then:
      - logger.log: "Arrêt de toutes les lectures -> Horloge (IR Bin)"
      - lambda: |-
          id(lightTO) = 0;
          id(assist_return_to_ma) = false;
          id(assist_return_to_local_radio) = false;
          id(assist_left_ma_group) = false;
      # 1. Arrêt de la Web Radio locale
      - if:
          condition:
            lambda: |-
              return id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                     id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;
          then:
            - media_player.stop:
                id: local_radio_player
                announcement: false
      # 2. Pause / Arrêt de Music Assistant (Sendspin)
      - if:
          condition:
            lambda: |-
              return id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                     id(music_source_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
          then:
            - media_player.pause: sendspin_media_player
            - media_player.stop: music_source_player
      # 3. Arrêt d'une éventuelle annonce vocale
      - if:
          condition:
            media_player.is_playing: speaker_media_player
          then:
            - media_player.stop:
                id: speaker_media_player
      # 4. Passage immédiat en veille sur l'écran horloge
      - lambda: |-
          id(music_active) = false;
          id(phase) = 1;
          id(clock_screensaver_active) = true;
          if (id(myDisplay).is_ready()) {
            id(myDisplay).show_page(clockP);
            id(myDisplay).update();
          }
      - script.execute: update_clock_brightness

  - id: ir_reboot_confirm
    mode: restart
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(ir_reboot_last_ms) > 0 && (now - id(ir_reboot_last_ms)) < 2000) {
            id(ir_reboot_last_ms) = 0;
            id(preset_message) = "REBOOT...";
          } else {
            id(ir_reboot_last_ms) = now;
            id(preset_message) = "REBOOT ? (2x)";
          }
      - light.turn_on:
          id: screen_backlight
          brightness: 100%
      - lambda: |-
          id(lightTO) = 0;
          if (id(myDisplay).is_ready()) {
            id(myDisplay).show_page(presetP);
            id(myDisplay).update();
          }
      - if:
          condition:
            lambda: 'return id(preset_message) == "REBOOT...";'
          then:
            - delay: 800ms
            - button.press: reboot_radio_btn
          else:
            - delay: 2000ms
            - lambda: 'id(ir_reboot_last_ms) = 0;'
            - script.execute: reset_display

