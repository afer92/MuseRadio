# 2026.11.0

# RAM:   [====      ]  39.0% (used 133431 bytes from 341760 bytes)
# Flash: [========  ]  82.2% (used 3232915 bytes from 3932160 bytes)

substitutions:
  name: raspiaudio-radio
  friendly_name: Raspiaudio Radio

.variables:
  - &weather_entity "weather.forecast_maison"

packages:
  - !include common/base_text_sensor.yaml
  - !include stations/stations.yaml 
    
# === 1. SYSTÈME, RÉSEAU & BUS MATÉRIELS (I2C, SPI, I2S) ===

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  name_add_mac_suffix: false
  project:
    name: raspiaudio.radio
    version: "2026.9.5"
  on_boot:
    - priority: 800
      then:
        - light.turn_off: screen_backlight
        - wait_until:
            condition:
              lambda: return id(myDisplay).is_ready();
            timeout: 3s
        - if:
            condition:
              lambda: return id(myDisplay).is_ready();
            then:
              - lambda: |-
                  id(myDisplay).show_page(logoP);
                  id(myDisplay).update();
              - light.turn_on: screen_backlight
            else:
              - logger.log: "Display not ready during boot splash"

    - priority: -100
      then:
        - output.turn_off: dac_mute
        - light.turn_on:
            id: screen_backlight
            brightness: 100%
        - lambda: |-
            id(lightTO) = 0;
            id(phase) = 0;
        - script.execute: apply_local_codec_volume
        - media_player.volume_set:
            id: speaker_media_player
            volume: !lambda return id(Vol);
        - script.execute: reset_display
        - text.set:
            id: radio_player
            value: !lambda 'return id(ma_player_entity_id);'

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

preferences:
  flash_write_interval: 5s

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: github://RASPIAUDIO/esphomeRadio@187efd71c9682f92dc03d22c546e6dcb729c4c36
    components: [es8388]

api:
  reboot_timeout: 0s

logger:
  level: DEBUG
  logs:
    sensor: WARN

wifi:
  id: wifi_ssid
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_1
      password: !secret wifi_password
  on_connect:
    - delay: 15s
    - logger.set_level: INFO
    - logger.log:
        format: "Connecté avec succès au SSID : %s"
        args: ['id(wifi_ssid_sensor).state.c_str()']
  ap:
    ssid: "Raspiaudio-radio-full"
    password: "12345678"

ota:
  - platform: esphome
    id: ota_esphome

captive_portal:

improv_serial:

time:
  - platform: homeassistant
    id: ha_time
    timezone: Europe/Paris
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - if:
              condition:
                lambda: 'return id(clock_screensaver_active) && id(myDisplay).is_ready();'
              then:
                - component.update: myDisplay
                - script.execute: update_clock_brightness
sun:
  id: sun_astro
  latitude: !secret latitude
  longitude: !secret longitude
  on_sunrise:
    - if:
        condition:
          lambda: 'return id(clock_screensaver_active);'
        then:
          - script.execute: update_clock_brightness
  on_sunset:
    - if:
        condition:
          lambda: 'return id(clock_screensaver_active);'
        then:
          - script.execute: update_clock_brightness


                  
remote_receiver:
  id: ir_receiver
  pin:
    number: GPIO47
    inverted: true
  dump: nec
  on_nec:
    then:
      - if:
          condition:
            lambda: 'return x.command == 0xBF40;'
          then:
            - logger.log: "IR volume up"
            - script.execute:
                id: adjust_volume
                delta: 0.05
      - if:
          condition:
            lambda: 'return x.command == 0xB748;'
          then:
            - logger.log: "IR volume down"
            - script.execute:
                id: adjust_volume
                delta: -0.05
      - if:
          condition:
            lambda: 'return ((x.command == 0xFE01) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR mute"
            - script.execute: mute_unmute
      - if:
          condition:
            lambda: 'return ((x.command == 0xF609) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR ret"
            - if:
                condition:
                  lambda: |-
                    return id(music_active) ||
                        id(assist_return_to_ma) ||
                        id(assist_return_to_local_radio) ||
                        id(sendspin_media_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
                then:
                  - script.execute: temporary_assist
                else:
                  - script.execute: go_assist
      - if:
          # Received NEC: address=0xFE01, command=0xF50A command_repeats=1
          condition:
            lambda: 'return ((x.command == 0xF50A) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR station next"
            - select.next:
                id: local_radio_select
                cycle: true
      - if:
          # Received NEC: address=0xFE01, command=0xFD02 command_repeats=1
          condition:
            lambda: 'return ((x.command == 0xFD02) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR station prev"
            - select.previous:
                id: local_radio_select
                cycle: true
      - if:
          # Received NEC: address=0xFE01, command=0xF906 command_repeats=1
          condition:
            lambda: 'return ((x.command == 0xF906) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR toggle local radio"
            - script.execute: toggle_local_radio
      - if:
          # Flèche Haut -> Preset MA suivant (remplacer 0xXXXX par le code relevé dans les logs)
          condition:
            lambda: 'return ((x.command == 0xFA05) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR MA preset next"
            - script.execute:
                id: cycle_ma_preset
                delta: 1
      - if:
          # Flèche Bas -> Preset MA précédent (remplacer 0xYYYY par le code relevé dans les logs)
          condition:
            lambda: 'return ((x.command == 0xFB04) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR MA preset prev"
            - script.execute:
                id: cycle_ma_preset
                delta: -1

      - if:
          # Touche Bin -> Arrêt de toutes les lectures (remplacer 0xZZZZ par le code relevé dans les logs)
          condition:
            lambda: 'return ((x.command == 0xBB44) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR stop all playback"
            - script.execute: stop_all_playback
      - if:
          # Bouton Rouge -> Redémarrage de la radio (remplacer 0xXXXX par le code relevé dans les logs)
          condition:
            lambda: 'return ((x.command == 0xFF00) && (x.address == 0xFE01));'
          then:
            - logger.log: "IR red button pressed"
            - script.execute: ir_reboot_confirm


es8388:

i2c:
  id: codec_bus
  scl: GPIO11
  sda: GPIO18
  scan: true

i2c_device:
  id: my_es8388
  address: 0x10

spi:
  - id: spi_bus0
    clk_pin: GPIO12
    mosi_pin: GPIO8
    interface: hardware

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO16
    i2s_bclk_pin: GPIO5
    i2s_mclk_pin: GPIO0

microphone:
  - platform: i2s_audio
    id: radio_mic
    sample_rate: 16000
    i2s_din_pin: GPIO4
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: radio_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO17
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: stereo
    buffer_duration: 500ms
  - platform: mixer
    id: radio_mixer
    output_speaker: radio_speaker
    num_channels: 2
    source_speakers:
      - id: assist_mixer_input
      - id: music_mixer_input
  - platform: resampler
    id: assist_speaker
    output_speaker: assist_mixer_input
    sample_rate: 48000
  - platform: resampler
    id: music_speaker
    output_speaker: music_mixer_input
    sample_rate: 48000

sendspin:
  id: sendspin_hub

media_source:
  - platform: sendspin
    id: sendspin_source
    buffer_size: 2000000

# === 2. AUDIO, LECTEURS & ASSISTANT VOCAL ===

media_player:
  - platform: speaker
    name: None
    id: speaker_media_player
    announcement_pipeline:
      speaker: assist_speaker
      format: WAV
      sample_rate: 48000
      num_channels: 1
    files:
      - id: little_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
    on_announcement:
      - if:
          condition:
            lambda: 'return (id(phase) != 2);'
          then:
            - lambda: |-
                id(lightTO) = 0;
                if (id(phase) == 1) {
                  id(phase) = 2;
                  id(external_player).execute();
                }
            - if:
                condition:
                  lambda: 'return id(auto_mute_active);'
                then:
                  - script.execute: mute_off
      - micro_wake_word.stop:
    on_idle:
      - wait_until:
          and:
            - not:
                media_player.is_announcing:
                  id: speaker_media_player
            - not:
                voice_assistant.is_running:
      - if:
          condition:
            lambda: 'return !id(assist_return_to_ma) && (id(phase) == 4 || id(phase) == 2);'
          then:
            - lambda: 'id(phase) = 1;'
            - script.execute: reset_display

  - platform: speaker
    id: local_radio_player
    name: "Local Web Radio"
    internal: true
    volume_initial: 0.2
    announcement_pipeline:
      speaker: assist_speaker
      format: WAV
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: music_speaker
      format: MP3
      sample_rate: 48000
      num_channels: 2
    on_state:
      - lambda: |-
          using media_player::MediaPlayerState;
          const bool playing = id(local_radio_player).state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
                               id(music_source_player).state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;
          if (playing != id(music_active)) {
            id(music_active) = playing;
            id(update_playback_mode).execute();
          }

  - platform: sendspin
    id: sendspin_media_player
    name: Radio Music Assistant
    volume_increment: 2%
    on_state:
      - if:
          condition:
            media_player.is_playing: sendspin_media_player
          then:
            - script.stop: enter_idle_mode
            - micro_wake_word.stop:
            - if:
                condition:
                  lambda: |-
                    return id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING ||
                           id(local_radio_player).state == media_player::MEDIA_PLAYER_STATE_PAUSED;
                then:
                  - media_player.stop:
                      id: local_radio_player
                      announcement: false
      - script.execute: schedule_music_refresh

  - platform: speaker_source
    id: music_source_player
    internal: true
    on_state:
      - lambda: |-
          using media_player::MediaPlayerState;
          const bool playing = id(local_radio_player).state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING ||
                               id(music_source_player).state == MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;
          if (playing != id(music_active)) {
            id(music_active) = playing;
            id(update_playback_mode).execute();
          }
    media_pipeline:
      speaker: music_speaker
      sources:
        - sendspin_source
      format: FLAC
      sample_rate: 48000
      num_channels: 2

micro_wake_word:
  id: mww
  microphone: radio_mic
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  on_wake_word_detected:
    - if:
        condition:
          lambda: |-
            return !id(mic_muted) && !id(music_active) &&
                id(sendspin_media_player).state != media_player::MEDIA_PLAYER_STATE_PLAYING;
        then:
          - light.turn_on:
              id: screen_backlight
              brightness: 100%
              effect: none
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: radio_mic
  media_player: speaker_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - logger.log: "listening 3 => phase"
    - micro_wake_word.stop:
    - light.turn_on:
        id: screen_backlight
        brightness: 100%
        effect: none
    - lambda: 'id(phase) = 3;'
    - script.execute: reset_display
  on_stt_end:
    - text_sensor.template.publish:
        id: text_request
        state: !lambda return x;
  on_tts_start:
    - logger.log: "answering 4 => phase"
    - text_sensor.template.publish:
        id: text_response
        state: !lambda return x;
    - light.turn_on:
        id: screen_backlight
        brightness: 100%
        effect: none
    - lambda: 'id(phase) = 4;'
    - script.execute: reset_display
  on_end:
    - wait_until:
        and:
          - not:
              media_player.is_announcing:
                id: speaker_media_player
          - not:
              voice_assistant.is_running:
    - if:
        condition:
          lambda: 'return id(assist_return_to_ma) || id(assist_return_to_local_radio);'
        then:
          - script.execute: finish_temporary_assist
        else:
          - if:
              condition:
                lambda: 'return !id(music_active) && (id(phase) != 1);'
              then:
                - lambda: 'id(phase) = 1;'
                - script.execute: reset_display
  on_error:
    - logger.log: "ERROR!!!!!!!!!!!!!!!!"
    - light.turn_on:
        id: screen_backlight
        brightness: 100%
        effect: none
    - delay: 1s
    - if:
        condition:
          lambda: 'return id(assist_return_to_ma) || id(assist_return_to_local_radio);'
        then:
          - script.execute: finish_temporary_assist
        else:
          - lambda: 'if (!id(music_active)) id(phase) = 1;'
          - script.execute: reset_display

output:
  - platform: gpio
    id: dac_mute
    pin:
      number: GPIO46
      inverted: true
      mode:
        output: true
      ignore_strapping_warning: true

  - platform: ledc
    pin:
      number: GPIO41
      mode:
        output: true
    id: screen_backlight_pin

light:
  - platform: monochromatic
    output: screen_backlight_pin
    id: screen_backlight
    name: Screen Backlight

globals:
  - id: music_active
    type: bool
    initial_value: 'false'
  - id: assist_return_to_ma
    type: bool
    initial_value: 'false'
  - id: assist_left_ma_group
    type: bool
    initial_value: 'false'
  - id: preset_message
    type: std::string
    initial_value: '""'
  - id: ma_player_entity_id
    type: std::string
    restore_value: true
    max_restore_data_length: 96
    initial_value: '""'
  - id: lightTO
    type: int
    initial_value: '0'
  - id: Vol
    type: float
    initial_value: '0.6'
    restore_value: true
  - id: ma_volume_target_percent
    type: int
    initial_value: '-1'
  - id: ma_volume_last_command_ms
    type: uint32_t
    initial_value: '0'
  - id: phase # 0: Boot/Logo | 1: Veille (WakeWord) | 2: Lecteur externe | 3: Écoute | 4: Réponse | 5: Musique
    type: int
    initial_value: '0'
  - id: mute
    type: bool
    initial_value: 'false'
  - id: mic_muted
    type: bool
    initial_value: 'false'
  - id: auto_mute_active
    type: bool
    initial_value: 'false'
  - id: volume_display_active
    type: bool
    initial_value: 'false'
  - id: volume_display_timer
    type: int
    initial_value: '0'
  - id: assist_return_to_local_radio
    type: bool
    initial_value: 'false'
  - id: clock_screensaver_active
    type: bool
    initial_value: 'false'
  - id: current_ma_preset
    type: int
    initial_value: '0'
  - id: ir_reboot_last_ms
    type: uint32_t
    initial_value: '0'

    
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return !id(clock_screensaver_active) && !id(music_active) && id(phase) == 1;'
          then:
            - if:
                condition:
                  lambda: 'return id(lightTO) < static_cast<int>(id(clock_standby_timeout).state);'
                then:
                  - lambda: id(lightTO)++;
                else:
                  - lambda: |-
                      id(lightTO) = 0;
                      id(clock_screensaver_active) = true;
                      if (id(myDisplay).is_ready()) {
                        id(myDisplay).show_page(clockP);
                        id(myDisplay).update();
                      }
                  - script.execute: update_clock_brightness
      - if:
          condition:
            lambda: 'return id(volume_display_active);'
          then:
            - if:
                condition:
                  lambda: 'return id(volume_display_timer) >= 3;'
                then:
                  - lambda: |-
                      id(volume_display_active) = false;
                      id(volume_display_timer) = 0;
                      if (id(myDisplay).is_ready()) id(myDisplay).update();
                else:
                  - lambda: id(volume_display_timer)++;

